services:
  - type: web
    name: minion-agent-office
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node bin/agent-office.js --host 0.0.0.0 --port $PORT --password 123456
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AGENT_OFFICE_PASSWORD
        value: 123456
      - key: AGENT_OFFICE_NO_OPEN
        value: 1
